<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda · rotinas do restaurante</title>
<meta name="description" content="Rotinas do restaurante no celular do gerente, com lembretes, comprovação por foto e acompanhamento do dono. Da Pontes – Consultoria e Gestão de iFood.">
<meta name="theme-color" content="#070C12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ronda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C12; --panel:#0D161F; --panel2:#122130; --cyan:#2CC5D0; --cyan-hi:#7DF3F8; --faint:rgba(44,197,208,.1);
  --line:rgba(44,197,208,.2); --line-hi:rgba(44,197,208,.6); --text:#E2F3F5; --muted:#8FA9B2; --ink:#04161A;
  --gold:#FFD27A; --red:#FF6B7A; --green:#5BE49B; --orange:#FFA65C;
  --display:'Orbitron','Exo 2',system-ui,sans-serif; --body:'Exo 2',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
body{background-image:radial-gradient(900px 500px at 50% -10%,rgba(44,197,208,.16),transparent 60%);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan-hi);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin:22px 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 1px var(--line-hi),0 0 16px -4px rgba(44,197,208,.6)}
.brand b{font-family:var(--display);letter-spacing:.14em;color:var(--cyan);font-size:18px;display:block;line-height:1}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip-btn{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip-btn:hover{border-color:var(--line-hi)}

/* cartões */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.glow{box-shadow:0 0 0 1px var(--line),0 18px 40px -18px rgba(0,0,0,.8),0 0 30px -12px rgba(44,197,208,.4)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* herói do gerente */
.hero{position:relative;overflow:hidden}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--panel2);box-shadow:0 0 0 2px var(--c,var(--cyan))}
.lvl{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--cyan-hi));box-shadow:0 0 12px var(--cyan);transition:width .6s}
.bar.gold>i{background:linear-gradient(90deg,#E8A93A,var(--gold));box-shadow:0 0 12px var(--gold)}
.stat{background:var(--panel2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.flame{color:var(--orange)}

/* missão agora */
.now{border-color:var(--line-hi);background:linear-gradient(160deg,rgba(44,197,208,.18),var(--panel) 60%)}
.now.late{border-color:rgba(255,107,122,.6);background:linear-gradient(160deg,rgba(255,107,122,.18),var(--panel) 60%)}
.now h3{font-size:21px;margin:6px 0 4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--faint);color:var(--cyan)}
.tag.red{background:rgba(255,107,122,.15);color:var(--red)}
.tag.green{background:rgba(91,228,155,.13);color:var(--green)}
.tag.gold{background:rgba(255,210,122,.13);color:var(--gold)}
.tag.gray{background:rgba(255,255,255,.06);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;background:var(--cyan);color:var(--ink);box-shadow:0 0 24px -6px var(--cyan);width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 0 24px -6px var(--red)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}

/* linha do tempo */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.tl li:last-child{border-bottom:0}
.tl .hr{font-family:var(--mono);font-size:14px;color:var(--muted);width:48px;flex:none}
.tl .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--panel2);font-size:16px}
.tl .ico.done{background:rgba(91,228,155,.15);color:var(--green)}
.tl .ico.late{background:rgba(255,107,122,.15);color:var(--red)}
.tl .ico.now{background:var(--cyan);color:var(--ink);box-shadow:0 0 14px var(--cyan)}
.tl .tt{flex:1;min-width:0}
.tl .tt b{display:block;font-weight:600;line-height:1.25}
.tl .tt span{font-size:12px;color:var(--muted)}
.tl button.go{border:1px solid var(--line-hi);background:var(--faint);color:var(--cyan);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.tl li.clickable{cursor:pointer}

/* alertas */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;margin-bottom:8px;background:rgba(255,107,122,.09);border:1px solid rgba(255,107,122,.3)}
.alert.warn{background:rgba(255,210,122,.08);border-color:rgba(255,210,122,.3)}
.alert.ok{background:rgba(91,228,155,.07);border-color:rgba(91,228,155,.25)}
.alert .em{font-size:20px;line-height:1.2}
.alert b{font-weight:700}

/* conquistas */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.badge .e{font-size:32px;display:block}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11px;color:var(--muted);display:block;line-height:1.3;margin-top:2px}
.badge.off{opacity:.38;filter:grayscale(1)}
.badge.off .e{filter:blur(.5px)}

/* ranking */
.rank li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rank{list-style:none;padding:0;margin:0}
.rank .pos{font-family:var(--display);width:28px;text-align:center;color:var(--muted)}
.rank li:first-child .pos{color:var(--gold)}

/* gráfico */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .col i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--cyan-hi),var(--cyan));min-height:3px}
.chart .col i.low{background:linear-gradient(180deg,#FF9AA5,var(--red))}
.chart .col i.mid{background:linear-gradient(180deg,#FFE3A8,var(--gold))}
.chart .col small{font-size:11px;color:var(--muted)}
.chart .col em{font-style:normal;font-family:var(--mono);font-size:11px}

/* nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(7,12,18,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.nav .in{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:12px;position:relative}
.nav button .i{font-size:21px;line-height:1}
.nav button.on{color:var(--cyan)}
.nav button.on .i{filter:drop-shadow(0 0 8px var(--cyan))}
.nav .dot{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* formulários e modal */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line-hi);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .25s}
.sheet h3{font-family:var(--display);font-size:18px;letter-spacing:.04em;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.in-f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.in-f:focus{border-color:var(--cyan);outline:none}
textarea.in-f{min-height:90px;resize:vertical}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{flex:1;min-width:40px}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:block;text-align:center;padding:9px 0;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.days input:checked+span{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.yn button{padding:22px 0;border-radius:16px;font-size:20px;font-weight:800;border:2px solid var(--line)}
.yn button.y{background:rgba(91,228,155,.1);border-color:rgba(91,228,155,.5);color:var(--green)}
.yn button.n{background:rgba(255,107,122,.1);border-color:rgba(255,107,122,.5);color:var(--red)}
.yn button.sel{box-shadow:0 0 0 3px currentColor}
.photo-drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--line-hi);border-radius:16px;padding:26px 12px;margin-top:14px;background:var(--faint);color:var(--cyan);font-weight:700;cursor:pointer}
.photo-drop img{max-width:100%;border-radius:12px;max-height:280px}
.check{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.check input{width:22px;height:22px;accent-color:var(--cyan)}
.proof-img{width:100%;border-radius:14px;margin-top:10px}
.ph{display:grid;place-items:center;height:160px;border-radius:14px;margin-top:10px;background:repeating-linear-gradient(45deg,var(--panel2) 0 12px,var(--panel) 12px 24px);color:var(--muted);font-size:13px}

/* comemoração */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line-hi);border-radius:14px;padding:12px 16px;width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.6);animation:drop .3s;font-size:14px}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,10,15,.93);animation:fade .2s}
.party .box{text-align:center;padding:24px;max-width:340px}
.party .big{font-family:var(--display);font-size:54px;color:var(--gold);text-shadow:0 0 30px rgba(255,210,122,.7);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.party .em{font-size:72px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.party h3{font-family:var(--display);font-size:20px;margin:8px 0 6px;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* escolha de perfil */
.pick{display:grid;gap:10px;margin-top:16px}
.pick button{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.pick button:hover{border-color:var(--line-hi)}
.pick b{display:block;font-size:17px}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--cyan) calc(var(--p)*1%),rgba(255,255,255,.07) 0)}
.ring>div{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-size:16px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* rede de lojas */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--cyan);color:var(--ink)}
.rank li.me{background:var(--faint);border-radius:12px;padding-left:6px;padding-right:6px;box-shadow:0 0 0 1px var(--line-hi)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.podium div{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 6px 6px;text-align:center;padding:10px 6px}
.podium .p1{border-color:rgba(255,210,122,.6);box-shadow:0 0 24px -8px rgba(255,210,122,.6);padding-top:16px}
.podium .m{font-size:30px;display:block}
.podium b{display:block;font-size:13px;line-height:1.2;margin-top:4px}
.podium span{font-family:var(--mono);font-size:13px;color:var(--gold)}
.store{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.store:last-child{border-bottom:0}
.store .nm{flex:1;min-width:0}
.store .nm b{display:block;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:99px;padding:5px 6px 5px 10px;font-size:13px;margin:4px 4px 0 0}
.pill button{border:0;background:rgba(255,255,255,.07);border-radius:99px;width:22px;height:22px;font-size:11px;color:var(--muted)}
.stores-pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:8px}
.stores-pick label{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.stores-pick input{width:18px;height:18px;accent-color:var(--cyan)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav hidden" id="nav"><div class="in" id="navIn"></div></nav>
<div id="layer"></div>

<script>
/* ============================================================
   RONDA — rotinas de uma rede de restaurantes, com jogo.
   O gestor cria a rotina uma vez e escolhe em quais lojas e
   em qual turno ela vale. Em cada loja, o gerente do turno faz.
   Protótipo: os dados ficam guardados no próprio aparelho.
   ============================================================ */
const APP = 'Ronda';
const KEY = 'ronda.v4';
const TOL = 15;           // minutos de tolerância antes de contar como atraso
const SOON = 30;          // minutos antes do horário em que a missão já pode ser feita
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const TURNOS = ['Diurno','Noturno'];
const TIPOS = {
  foto:{n:'Foto',e:'📸'}, sim:{n:'Sim / Não',e:'✅'}, numero:{n:'Número',e:'🔢'},
  texto:{n:'Texto',e:'📝'}, checklist:{n:'Checklist',e:'☑️'}
};
const NIVEIS = [
  [0,'Novato'],[120,'Aprendiz'],[300,'Braço Direito'],[600,'Gerente Raiz'],
  [1000,'Mestre da Casa'],[1600,'Lenda do Salão'],[2500,'Dono do Pedaço']
];
const EMOJIS = ['🦊','🐻','🦁','🐯','🐼','🦉','🐺','🐙','🐨','🦅','🐬','🐝'];
const CORES = ['#2CC5D0','#FFA65C','#5BE49B','#FFD27A','#C69CFF','#FF6B7A'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = hhmm => { const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
const fmtMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const today = () => dkey(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return d; };
const uid = () => Math.random().toString(36).slice(2,9);
const atraso = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${m%60 ? pad(m%60) : ''}`;
const dataBR = dk => new Date(dk + 'T12:00').toLocaleDateString('pt-BR');
const medal = i => i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `${i+1}º`;

/* ---------- dados ---------- */
let S, ME, TAB, PERIODO = 'sem', PICK = null, IDX = null;

function seed(){
  // lojas e gerentes reais (D = diurno, N = noturno). A Biggs 9 funciona junto com a Biggs 8.
  const rede = [
    ['Biggs 1 · Av. Maringá','Alexandre Martins','William Moraes'],
    ['Biggs 2 · Av. S. Dumont','Omar Felipe','José Alcino'],
    ['Biggs 3 · Rua Goiás','William Cruz','Gabriel Augusto'],
    ['Biggs 4 · Av. W. Churchill','Fabian Gomes','Mauro José'],
    ['Biggs 5 · Av. Portugal','Hiana Araujo','Julio Cesar'],
    ['Biggs 6 · Av. Higienópolis','Talia da Silva','Diego Henrico'],
    ['Biggs 7 · Av. Jamil Scaff','José Igor','Jessyka Lima'],
    ['Biggs 8 e 9 · Pizzas & Massas + Biggs Street','Anderson Capanema','Leandro Ribeiro'],
    ['Biggs 10 · Av. das Maritacas','Isabelle Cremonez','Nayara Suellen'],
    ['Biggs 11 · Santo Amaro','Yuri Vinicius','Vanessa Peralta'],
    ['Biggs 12 · Saul Elkind','Janaina Perole','João Nalepa'],
    ['Biggs 13 · Av. Arthur Thomas','Felipe Bianco','Eliezer David']
  ];
  let r = 11;
  const rnd = () => (r = (r*9301 + 49297) % 233280) / 233280;
  const stores = rede.map(x => ({id:uid(), name:x[0]}));
  const users = [];
  rede.forEach((x,i) => ['Diurno','Noturno'].forEach((tu,j) => {
    const k = i*2 + j;
    users.push({id:uid(), name:x[1+j], store:stores[i].id, turno:tu, emoji:EMOJIS[k % EMOJIS.length], color:CORES[k % CORES.length]});
  }));
  const T = (title,time,turno,type,extra={}) => ({id:uid(),title,time,turno,type,stores:'all',days:[0,1,2,3,4,5,6],pts:10,hint:'',active:true,...extra});
  const tasks = [
    T('Conferir o nível do gás','09:00','Diurno','numero',{unit:'%',min:25,hint:'Olhe o medidor do botijão/central e anote a porcentagem.'}),
    T('Salão limpo e apresentável','10:45','Diurno','foto',{hint:'Foto do salão inteiro, mesas montadas.'}),
    T('Abrir a porta do salão','11:00','Diurno','sim',{hint:'Porta aberta e placa virada para "Aberto"?'}),
    T('Enviar malote','13:00','Diurno','foto',{days:[1,2,3,4,5],pts:20,hint:'Foto do malote lacrado com o comprovante.'}),
    T('Preencher relatório do dia','14:00','Diurno','checklist',{items:['Vendas do almoço lançadas','Sangria do caixa feita','Quebras e perdas anotadas'],hint:'Marque tudo o que foi feito.'}),
    T('Fechar o ponto','15:00','Diurno','sim',{hint:'Todos bateram o ponto de saída do turno?'}),
    T('Feedback de troca de turno','17:00','Noturno','texto',{pts:15,hint:'O que o turno do dia passou? Faltas, problemas, pendências.'}),
    T('Fechar o caixa','23:00','Noturno','foto',{pts:15,hint:'Foto do fechamento do caixa.'}),
    T('Desligar gás e equipamentos','23:30','Noturno','checklist',{items:['Gás fechado','Fritadeiras e chapas desligadas','Luzes do salão apagadas','Portas trancadas']})
  ];
  const s = {company:'Biggs', stores, users, tasks, recs:[]};
  // histórico de exemplo: cada loja com um "capricho" diferente, para o ranking ter graça
  const nm = nowMin();
  const capricho = {}; stores.forEach(st => capricho[st.id] = .62 + rnd()*.36);
  for (let i = 9; i >= 0; i--){
    const d = daysAgo(i), wd = d.getDay(), dk = dkey(d);
    for (const st of stores){
      const c = capricho[st.id];
      for (const t of tasks){
        if (!t.days.includes(wd)) continue;
        const tm = toMin(t.time);
        if (i === 0 && tm > nm - 20) continue;           // hoje: só o que já passou
        if (rnd() > c + .03) continue;                   // esquecida
        const lateBy = Math.round(rnd()*(70*(1-c)+20) - 14);
        const at = Math.min(23*60+59, Math.max(0, tm + lateBy)), ok = lateBy <= TOL;
        const who = users.find(u => u.store === st.id && u.turno === t.turno);
        let proof = {type:t.type};
        if (t.type === 'numero') proof.val = Math.round(21 + rnd()*74);
        if (t.type === 'sim') proof.val = rnd() > .06 ? 'sim' : 'nao';
        if (t.type === 'sim' && proof.val === 'nao') proof.note = 'Exemplo de demonstração';
        if (t.type === 'texto') proof.val = ['Tudo certo, sem pendências.','Faltou guardanapo no estoque.','Freezer 2 fazendo barulho, chamar técnico.','Movimento forte, repor refrigerante.','Um funcionário faltou, cobrimos com o turno da noite.'][Math.floor(rnd()*5)];
        if (t.type === 'checklist') proof.val = t.items.slice();
        if (t.type === 'foto') proof.val = null;
        s.recs.push({id:uid(), t:t.id, d:dk, s:st.id, m:who ? who.id : null, at, ok, pts: ok ? t.pts + 5 : Math.ceil(t.pts/2), proof, demo:true});
      }
    }
  }
  return s;
}

/* ---------- regras ---------- */
const user = id => S.users.find(u => u.id === id);
const task = id => S.tasks.find(t => t.id === id);
const store = id => S.stores.find(s => s.id === id);
const sname = id => store(id)?.name || 'Loja removida';
const wdOf = dk => new Date(dk + 'T12:00').getDay();
const appliesTo = (t, sid) => t.stores === 'all' || (Array.isArray(t.stores) && t.stores.includes(sid));
const turnoOk = (t, turno) => !turno || t.turno === 'Todos' || t.turno === turno;
// rotinas de uma loja num dia (opcional: só de um turno)
const tasksOn = (dk, sid, turno) => {
  const wd = wdOf(dk);
  return S.tasks.filter(t => t.active && t.days.includes(wd) && appliesTo(t, sid) && turnoOk(t, turno)).sort((a,b) => a.time.localeCompare(b.time));
};
const myTasks = (dk, u) => tasksOn(dk, u.store, u.turno);
function recOf(tid, dk, sid){
  if (!IDX){ IDX = new Map(); for (const r of S.recs) IDX.set(`${r.t}|${r.d}|${r.s}`, r); }
  return IDX.get(`${tid}|${dk}|${sid}`);
}
function status(t, dk, sid){
  const r = recOf(t.id, dk, sid);
  if (r) return {s:'feito', r};
  const td = today();
  if (dk < td) return {s:'perdida'};
  if (dk > td) return {s:'depois'};
  const diff = nowMin() - toMin(t.time);
  if (diff > TOL) return {s:'atrasada', late: diff};
  if (diff >= -SOON) return {s:'agora', diff};
  return {s:'depois'};
}
const responsaveis = (t, sid) => S.users.filter(u => u.store === sid && turnoOk(t, u.turno));
const quem = (t, sid) => { const rs = responsaveis(t, sid); return rs.length ? rs.map(u => u.name).join(' / ') : 'Sem gerente'; };
function problem(r, t){
  if (!r || !t) return null;
  if (t.type === 'sim' && r.proof.val === 'nao') return `respondeu NÃO${r.proof.note ? ': “' + r.proof.note + '”' : ''}`;
  if (t.type === 'numero' && t.min != null && r.proof.val != null && Number(r.proof.val) < Number(t.min)) return `marcou ${r.proof.val}${t.unit||''} (abaixo do mínimo de ${t.min}${t.unit||''})`;
  return null;
}
const xpOf = id => S.recs.reduce((a,r) => r.m === id ? a + r.pts : a, 0);
function level(xp){
  let i = 0; while (i < NIVEIS.length-1 && xp >= NIVEIS[i+1][0]) i++;
  const cur = NIVEIS[i][0], next = NIVEIS[i+1] ? NIVEIS[i+1][0] : cur + 1000;
  return {n:i+1, name:NIVEIS[i][1], cur, next, pct: Math.min(100, (xp-cur)/(next-cur)*100)};
}
function dayDone(u, dk){ const ts = myTasks(dk, u); if (!ts.length) return null; return ts.every(t => recOf(t.id, dk, u.store)); }
function dayPerfect(u, dk){ const ts = myTasks(dk, u); if (!ts.length) return false; return ts.every(t => { const r = recOf(t.id, dk, u.store); return r && r.ok; }); }
function streak(u){
  let n = 0;
  if (dayDone(u, today()) === true) n++;
  for (let i = 1; i < 120; i++){ const v = dayDone(u, dkey(daysAgo(i))); if (v === null) continue; if (!v) break; n++; }
  return n;
}
// período do ranking
function periodo(p){
  if (p === 'hoje') return {n:1, from:today(), nome:'hoje'};
  if (p === 'mes'){ const n = new Date().getDate(); return {n, from:dkey(daysAgo(n-1)), nome:'neste mês'}; }
  return {n:7, from:dkey(daysAgo(6)), nome:'nos últimos 7 dias'};
}
// Índice de preenchimento: no horário vale 1, atrasada vale ½, esquecida vale 0
function indice(sid, n, turno){
  let tot = 0, pts = 0, feitas = 0, ok = 0;
  for (let i = 0; i < n; i++){
    const dk = dkey(daysAgo(i));
    for (const t of tasksOn(dk, sid, turno)){
      const st = status(t, dk, sid);
      if (st.s === 'depois' || st.s === 'agora') continue;
      tot++; if (st.s === 'feito'){ feitas++; if (st.r.ok){ ok++; pts += 1; } else pts += .5; }
    }
  }
  return {tot, feitas, ok, pct: tot ? Math.round(pts/tot*100) : null};
}
const xpPeriodo = (fn, from) => S.recs.reduce((a,r) => r.d >= from && fn(r) ? a + r.pts : a, 0);
function rankLojas(p){
  const pr = periodo(p);
  return S.stores.map(s => ({s, i:indice(s.id, pr.n), xp:xpPeriodo(r => r.s === s.id, pr.from)}))
    .sort((a,b) => (b.i.pct ?? -1) - (a.i.pct ?? -1) || b.xp - a.xp);
}
function rankGerentes(p){
  const pr = periodo(p);
  return S.users.map(u => ({u, xp:xpPeriodo(r => r.m === u.id, pr.from)})).sort((a,b) => b.xp - a.xp);
}
function badges(u){
  const rs = S.recs.filter(r => r.m === u.id);
  const onTime = rs.filter(r => r.ok).length;
  const fotos = rs.filter(r => r.proof.type === 'foto').length;
  const cedo = rs.filter(r => r.at < 9*60).length;
  let perfeitos = 0; for (let i = 0; i < 60; i++) if (dayPerfect(u, dkey(daysAgo(i)))) perfeitos++;
  const st = streak(u), xp = xpOf(u.id);
  const pos = rankLojas('sem').findIndex(x => x.s.id === u.store);
  const pr = (v, goal) => ({ok: v >= goal, p: `${Math.min(v,goal)}/${goal}`});
  return [
    {e:'🎯', n:'Primeira missão', d:'Concluiu a 1ª tarefa', ...pr(rs.length,1)},
    {e:'⏱️', n:'Pontual', d:'10 tarefas no horário', ...pr(onTime,10)},
    {e:'🕰️', n:'Relógio suíço', d:'50 tarefas no horário', ...pr(onTime,50)},
    {e:'💯', n:'Dia perfeito', d:'Tudo no horário num dia', ...pr(perfeitos,1)},
    {e:'🔥', n:'Pegando fogo', d:'3 dias seguidos completos', ...pr(st,3)},
    {e:'🏆', n:'Semana de ouro', d:'7 dias seguidos completos', ...pr(st,7)},
    {e:'📸', n:'Fotógrafo', d:'10 comprovações com foto', ...pr(fotos,10)},
    {e:'🌅', n:'Madrugador', d:'5 tarefas antes das 9h', ...pr(cedo,5)},
    {e:'🏅', n:'Pódio', d:'Sua loja no top 3 da semana', ok: pos > -1 && pos < 3, p: pos > -1 ? `hoje: ${pos+1}º` : '–'},
    {e:'👑', n:'Lenda', d:'Chegou a 1.600 XP', ...pr(xp,1600)}
  ];
}

function tlItem(t, dk, sid, mine){
  const st = status(t, dk, sid);
  let ico = TIPOS[t.type].e, cls = '', sub = '', right = '';
  if (st.s === 'feito'){
    const p = problem(st.r, t);
    cls = p ? 'late' : 'done'; ico = p ? '⚠️' : '✓';
    sub = `${!mine && user(st.r.m) ? esc(user(st.r.m).name) + ' · ' : ''}Feito às ${fmtMin(st.r.at)} · ${st.r.ok ? 'no horário' : 'com atraso'} · +${st.r.pts} XP${p ? ' · ' + esc(p) : ''}`;
  } else {
    if (st.s === 'atrasada'){ cls = 'late'; ico = '!'; sub = `Atrasada ${atraso(st.late)}`; }
    else if (st.s === 'perdida'){ cls = 'late'; ico = '✕'; sub = 'Não foi feita'; }
    else if (st.s === 'agora'){ cls = 'now'; ico = '⚡'; sub = 'Pode fazer agora'; }
    else sub = `${TIPOS[t.type].n} · +${t.pts + 5} XP`;
    if (!mine) sub = `${esc(quem(t, sid))} · ${sub}`;
  }
  if (mine && ['atrasada','agora','depois'].includes(st.s) && dk === today()) right = `<button class="go" data-act="do" data-v="${t.id}">Fazer</button>`;
  const click = st.s === 'feito' ? `class="clickable" data-act="proof" data-v="${st.r.id}"` : '';
  return `<li ${click}><span class="hr">${t.time}</span><span class="ico ${cls}">${ico}</span><span class="tt"><b>${esc(t.title)}</b><span>${sub}</span></span>${right}</li>`;
}

function alertsToday(){
  const dk = today(), out = [];
  for (const s of S.stores) for (const t of tasksOn(dk, s.id)){
    const st = status(t, dk, s.id);
    if (st.s === 'atrasada') out.push({k:'red', e:'⏰', late:st.late, h:`<b>${esc(s.name)}:</b> ${esc(quem(t, s.id))} ainda não fez “${esc(t.title)}”`, s:`Era às ${t.time} · atraso de ${atraso(st.late)}`});
    if (st.s === 'feito'){ const p = problem(st.r, t); if (p) out.push({k:'warn', e:'⚠️', late:-1, h:`<b>${esc(s.name)}:</b> “${esc(t.title)}”, ${esc(user(st.r.m)?.name || '')} ${esc(p)}`, s:`Às ${fmtMin(st.r.at)}`, id:st.r.id}); }

}

function ownerInsights(){
  const days = [];

    const d = daysAgo(i), dk = dkey(d); let tot = 0, ok = 0, feitas = 0;
    for (const s of S.stores) for (const t of tasksOn(dk, s.id)){ const st = status(t, dk, s.id); if (st.s === 'depois' || st.s === 'agora') continue; tot++; if (st.s === 'feito'){ feitas++; if (st.r.ok) ok++; } }
    days.push({lab: i === 0 ? 'Hoje' : DIAS[d.getDay()], pct: tot ? Math.round(ok/tot*100) : null, tot, feitas, ok});
  }
  const sum = days.reduce((a,x) => ({tot:a.tot+x.tot, ok:a.ok+x.ok, feitas:a.feitas+x.feitas}), {tot:0,ok:0,feitas:0});
  const porTarefa = S.tasks.map(t => {
    let tot = 0, late = 0, miss = 0, lateMin = 0;
    for (let i = 0; i < 14; i++){
      const dk = dkey(daysAgo(i));
      for (const s of S.stores){
        if (!tasksOn(dk, s.id).includes(t)) continue;
        const st = status(t, dk, s.id); if (st.s === 'depois' || st.s === 'agora') continue;
        tot++; if (st.s !== 'feito'){ miss++; continue; }
        if (!st.r.ok){ late++; lateMin += st.r.at - toMin(t.time); }
      }
    }
    return {t, tot, late, miss, bad: tot ? (late+miss)/tot : 0, media: late ? Math.round(lateMin/late) : 0};
  }).filter(x => x.tot).sort((a,b) => b.bad - a.bad);
  const pior = porTarefa[0];
  const rk = rankLojas('sem').filter(x => x.i.pct !== null);
  const valid = days.filter(x => x.pct !== null);
  const piorDia = valid.length ? valid.reduce((a,b) => b.pct < a.pct ? b : a) : null;
  const probs = S.recs.filter(r => r.d >= dkey(daysAgo(13)) && problem(r, task(r.t)));

  let h = `<h2>Rede inteira · 7 dias</h2><div class="card"><div class="row between"><b>% das rotinas feitas no horário</b><span class="tag">${sum.tot ? Math.round(sum.ok/sum.tot*100) : 0}% média</span></div>
    <div class="chart">${days.map(x => `<div class="col"><em>${x.pct===null?'–':x.pct+'%'}</em><i class="${x.pct===null?'':x.pct<60?'low':x.pct<85?'mid':''}" style="height:${x.pct||0}%"></i><small>${x.lab}</small></div>`).join('')}</div>
    <p class="small muted" style="margin-top:8px">${sum.feitas} de ${sum.tot} rotinas feitas · ${sum.tot - sum.feitas} esquecida(s)</p></div>

  const tips = [];
  if (rk.length > 1){
    const best = rk[0], worst = rk[rk.length-1];
    tips.push(['🏆', `<b>${esc(best.s.name)}</b> é a loja que melhor preenche: índice de ${best.i.pct}% na semana.`, 'Use como exemplo para as outras e reconheça a equipe em público.']);
    tips.push(['🚨', `<b>${esc(worst.s.name)}</b> está em último, com ${worst.i.pct}%.`, `Gerentes: ${esc(S.users.filter(u => u.store === worst.s.id).map(u => u.name).join(', ') || 'nenhum')}. Vale uma conversa ou uma visita.`]);
    const abaixo = rk.filter(x => x.i.pct < 70);
    if (abaixo.length) tips.push(['📉', `<b>${abaixo.length} loja(s)</b> abaixo de 70% na semana.`, abaixo.map(x => esc(x.s.name)).join(', ')]);
  }
  if (pior && pior.bad > 0) tips.push(['🐢', `<b>“${esc(pior.t.title)}”</b> é a rotina mais problemática da rede: atrasou ou ficou sem fazer em ${Math.round(pior.bad*100)}% das vezes nas últimas 2 semanas${pior.media ? ` (atraso médio de ${pior.media} min)` : ''}.`, 'Talvez o horário não seja realista, ou a rotina precise de uma explicação melhor.']);
  if (piorDia && piorDia.pct < 85) tips.push(['📅', `O dia mais fraco foi <b>${piorDia.lab}</b>, com ${piorDia.pct}% no horário.`, 'Veja se faltou gente ou se o movimento foi fora do normal.']);
  for (const t of S.tasks.filter(t => t.type === 'numero' && t.min != null)){
    const baixas = [];
    for (const s of S.stores){
      const rs = S.recs.filter(r => r.t === t.id && r.s === s.id && r.proof.val != null).sort((a,b) => (a.d + pad(a.at)).localeCompare(b.d + pad(b.at)));
      const last = rs[rs.length-1]; if (last && Number(last.proof.val) < t.min) baixas.push(`${s.name} (${last.proof.val}${t.unit||''})`);
    }
    if (baixas.length) tips.push(['🔴', `<b>${baixas.length} loja(s)</b> com “${esc(t.title)}” abaixo de ${t.min}${esc(t.unit||'')} na última leitura.`, esc(baixas.join(', '))]);
  }
  if (probs.length) tips.push(['⚠️', `<b>${probs.length} problema(s)</b> relatado(s) na rede nas últimas 2 semanas (respostas “não” ou valores fora do normal).`, 'Os de hoje aparecem na aba Agora, com detalhes e fotos.']);
  h += tips.length ? tips.map(([e,a,b]) => `<div class="card row" style="align-items:flex-start"><span style="font-size:24px">${e}</span><div><p>${a}</p><p class="small muted" style="margin-top:4px">${b}</p></div></div>`).join('') : '<p class="empty">Ainda não há dados suficientes. Volte daqui a alguns dias.</p>';
  const textos = S.recs.filter(r => r.proof.type === 'texto' && r.proof.val).sort((a,b) => (b.d + pad(b.at)).localeCompare(a.d + pad(a.at))).slice(0,4);
  if (textos.length) h += `<h2>Últimos recados de turno</h2>${textos.map(r => `<div class="card small" data-act="proof" data-v="${r.id}" style="cursor:pointer"><span class="muted">${esc(sname(r.s))} · ${esc(user(r.m)?.name||'')} · ${dataBR(r.d)} ${fmtMin(r.at)}</span><p style="margin-top:4px">“${esc(r.proof.val)}”</p></div>`).join('')}`;
  return h;
}

function sheet(html){

}
const closeSheet = () => { $('#layer').innerHTML = ''; };

let DRAFT = null;
function openDo(tid){
  const t = task(tid); if (!t) return;

  let body = '';
  if (t.type === 'foto') body = `<input type="file" id="ph" accept="image/*" capture="environment" class="hidden"><label for="ph" class="photo-drop" id="phBox"><span style="font-size:38px">📸</span>Tirar foto</label>`;

    <h3 style="margin-top:12px">${esc(t.title)}</h3>${t.hint ? `<p class="muted small">${esc(t.hint)}</p>` : ''}
    ${body}<button class="btn" style="margin-top:18px" data-act="finish">Confirmar e ganhar XP</button>`);
  if (t.type === 'foto') $('#ph').addEventListener('change', onPhoto);
}
function onPhoto(e){
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    DRAFT.val = c.toDataURL('image/jpeg', .62);
    URL.revokeObjectURL(url);
    $('#phBox').innerHTML = `<img src="${DRAFT.val}" alt="Foto tirada"><span class="small">Toque para tirar outra</span>`;
  };
  img.src = url;
}
function finish(){
  const t = task(DRAFT.t), u = user(ME.id); if (!t || !u) return;
  let val = DRAFT.val, note = '';
  if (t.type === 'foto' && !val) return toast('📸 Tire a foto para comprovar.');
  if (t.type === 'sim'){ if (!val) return toast('Responda sim ou não.'); note = ($('#note')?.value || '').trim(); if (val === 'nao' && !note) return toast('Conte rapidinho o que aconteceu.'); }
  if (t.type === 'numero'){ val = $('#num').value; if (val === '') return toast('Digite o valor.'); val = Number(val); }
  if (t.type === 'texto'){ val = $('#txt').value.trim(); if (val.length < 3) return toast('Escreva um pouco mais.'); }
  if (t.type === 'checklist'){ if ([...document.querySelectorAll('.ck')].some(c => !c.checked)) return toast('Marque todos os itens para concluir.'); val = t.items.slice(); }
  const dk = today(), sid = u.store; if (recOf(t.id, dk, sid)){ closeSheet(); render(); return; }
  const at = nowMin(), ok = at - toMin(t.time) <= TOL;
  const antes = myTasks(dk, u).filter(x => x.id !== t.id && x.time < t.time);
  let combo = 0; for (let i = antes.length-1; i >= 0; i--){ const r = recOf(antes[i].id, dk, sid); if (r && r.ok) combo++; else break; }
  const bonusCombo = ok ? Math.min(combo, 5) : 0;
  const pts = (ok ? t.pts + 5 : Math.ceil(t.pts/2)) + bonusCombo;
  const before = {lv: level(xpOf(u.id)).n, bs: badges(u).filter(b => b.ok).map(b => b.n), pos: rankLojas('sem').findIndex(x => x.s.id === sid)};
  const rec = {id:uid(), t:t.id, d:dk, s:sid, m:u.id, at, ok, pts, proof:{type:t.type, val, note}};
  S.recs.push(rec); save(); closeSheet();
  const lvNow = level(xpOf(u.id)), newB = badges(u).filter(b => b.ok && !before.bs.includes(b.n));
  const posNow = rankLojas('sem').findIndex(x => x.s.id === sid);
  const allDone = myTasks(dk, u).every(x => recOf(x.id, dk, sid));
  const q = [];
  q.push({em: ok ? '⚡' : '🐢', big:`+${pts} XP`, h: ok ? 'Missão cumprida no horário!' : 'Feito, mas com atraso', s: ok ? (bonusCombo ? `Combo x${combo+1}! +${bonusCombo} de bônus` : 'Bônus de pontualidade garantido') : 'Atrasos valem metade dos pontos. Amanhã você pega!'});
  if (problem(rec, t)) q.push({em:'📣', h:'Gestor avisado', s:'Registramos o problema. Ele aparece no painel do gestor.'});
  if (posNow > -1 && posNow < before.pos) q.push({em:'📈', big:`${posNow+1}º lugar`, h:`${sname(sid)} subiu no ranking!`, s:`Passou de ${before.pos+1}º para ${posNow+1}º entre ${S.stores.length} lojas.`});
  if (allDone) q.push({em:'🏁', h:'Todas as missões do dia!', s:`Sequência: 🔥 ${streak(u)} dia(s)`});
  if (lvNow.n > before.lv) q.push({em:'🆙', big:`Nível ${lvNow.n}`, h:lvNow.name, s:'Você subiu de nível!'});
  for (const b of newB) q.push({em:b.e, h:'Conquista: ' + b.n, s:b.d});
  party(q); render();
}
let PARTY = [];
function party(queue){

  if (navigator.vibrate) try { navigator.vibrate([40,40,80]); } catch(e){}
  $('#layer').innerHTML = `<div class="party" data-act="partyNext"><div class="box"><div class="em">${x.em}</div>${x.big ? `<div class="big">${x.big}</div>` : ''}<h3>${esc(x.h)}</h3><p class="muted">${esc(x.s)}</p><p class="small muted" style="margin-top:22px">toque para continuar</p></div></div>`;
  PARTY = queue;
}
function confetti(n){

  const cs = ['#2CC5D0','#7DF3F8','#FFD27A','#5BE49B','#FF6B7A','#FFA65C'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cs[i % cs.length];
    c.style.animationDuration = (1.6 + Math.random()*1.6) + 's'; c.style.animationDelay = Math.random()*.3 + 's';
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}
function openProof(rid){
  const r = S.recs.find(x => x.id === rid); if (!r) return;
  const t = task(r.t), u = user(r.m), p = problem(r, t), v = r.proof.val;
  let body = '';
  if (r.proof.type === 'foto') body = v ? `<img class="proof-img" src="${v}" alt="Foto enviada">` : `<div class="ph">📷 Foto do exemplo de demonstração</div>`;
  if (r.proof.type === 'sim') body = `<p style="font-size:26px;font-weight:800;margin-top:12px;color:${v==='sim'?'var(--green)':'var(--red)'}">${v==='sim'?'👍 Sim':'👎 Não'}</p>${r.proof.note ? `<p class="card small" style="margin-top:8px">“${esc(r.proof.note)}”</p>` : ''}`;
  if (r.proof.type === 'numero') body = `<p class="mono" style="font-size:34px;font-weight:700;margin-top:12px">${esc(v)}${esc(t?.unit||'')}</p>`;
  if (r.proof.type === 'texto') body = `<p class="card" style="margin-top:12px">“${esc(v)}”</p>`;
  if (r.proof.type === 'checklist') body = `<ul style="margin-top:12px;padding-left:0;list-style:none">${(v||[]).map(x => `<li>✅ ${esc(x)}</li>`).join('')}</ul>`;
  sheet(`<div class="row between"><span class="tag ${r.ok?'green':'red'}">${r.ok?'No horário':'Com atraso'} · +${r.pts} XP</span><button class="chip-btn" data-act="close" aria-label="Fechar">✕</button></div>
    <h3 style="margin-top:12px">${esc(t?.title || 'Rotina apagada')}</h3>
    <p class="muted small">🏪 ${esc(sname(r.s))} · ${u ? u.emoji + ' ' + esc(u.name) + ' · ' : ''}${dataBR(r.d)} às ${fmtMin(r.at)} (previsto ${t?.time||'–'})</p>
    ${p ? `<div class="alert warn" style="margin-top:10px"><span class="em">⚠️</span><div>${esc(p)}</div></div>` : ''}${body}`);
}
function openEdit(tid){
  const t = tid ? task(tid) : {id:'', title:'', time:'09:00', turno:'Diurno', stores:'all', type:'sim', days:[0,1,2,3,4,5,6], pts:10, hint:'', active:true, items:[], unit:'', min:null};
  const todas = t.stores === 'all';
  sheet(`<div class="row between"><h3>${tid ? 'Editar rotina' : 'Nova rotina'}</h3><button class="chip-btn" data-act="close" aria-label="Fechar">✕</button></div>
    <label class="f" for="eTitle">O que precisa ser feito</label><input class="in-f" id="eTitle" value="${esc(t.title)}" placeholder="Ex.: Conferir o nível do gás">
    <div class="grid2"><div><label class="f" for="eTime">Horário</label><input class="in-f" id="eTime" type="time" value="${t.time}"></div>
    <div><label class="f" for="eTurno">Turno de quem faz</label><select class="in-f" id="eTurno">${[...TURNOS,'Todos'].map(x => `<option value="${x}" ${x===t.turno?'selected':''}>${x === 'Todos' ? 'Qualquer turno' : x}</option>`).join('')}</select></div></div>
    <label class="f">Dias da semana</label><div class="days">${DIAS.map((d,i) => `<label><input type="checkbox" class="eDay" value="${i}" ${t.days.includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div>
    <label class="f">Em quais lojas</label><div class="days"><label><input type="radio" name="eAll" value="all" ${todas?'checked':''}><span>Todas as lojas</span></label><label><input type="radio" name="eAll" value="some" ${todas?'':'checked'}><span>Escolher lojas</span></label></div>
    <div id="eStores" class="stores-pick ${todas?'hidden':''}">${S.stores.map(s => `<label><input type="checkbox" class="eStore" value="${s.id}" ${!todas && t.stores.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div>
    <label class="f" for="eType">Como comprovar</label><select class="in-f" id="eType">${Object.entries(TIPOS).map(([k,v]) => `<option value="${k}" ${k===t.type?'selected':''}>${v.e} ${v.n}</option>`).join('')}</select>
    <div id="xNum" class="${t.type==='numero'?'':'hidden'} grid2"><div><label class="f" for="eUnit">Unidade</label><input class="in-f" id="eUnit" value="${esc(t.unit||'')}" placeholder="%, °C, kg…"></div>
      <div><label class="f" for="eMin">Me avisar se ficar abaixo de</label><input class="in-f" id="eMin" type="number" inputmode="decimal" value="${t.min ?? ''}"></div></div>
    <div id="xCk" class="${t.type==='checklist'?'':'hidden'}"><label class="f" for="eItems">Itens (um por linha)</label><textarea class="in-f" id="eItems">${esc((t.items||[]).join('\n'))}</textarea></div>
    <label class="f" for="eHint">Instruções para o gerente (opcional)</label><input class="in-f" id="eHint" value="${esc(t.hint||'')}">
    <label class="f" for="ePts">Valor da missão</label><select class="in-f" id="ePts">${[[5,'Leve · 5 pts'],[10,'Normal · 10 pts'],[15,'Importante · 15 pts'],[20,'Crítica · 20 pts']].map(([v,n]) => `<option value="${v}" ${v==t.pts?'selected':''}>${n}</option>`).join('')}</select>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="eAct" ${t.active?'checked':''}><span>Rotina ativa</span></label>
    <button class="btn" style="margin-top:16px" data-act="saveTask" data-v="${t.id}">Salvar rotina</button>
    ${tid ? `<button class="btn ghost" style="margin-top:10px;color:var(--red)" data-act="delTask" data-v="${t.id}">Apagar rotina</button>` : ''}`);
  $('#eType').addEventListener('change', e => { $('#xNum').classList.toggle('hidden', e.target.value !== 'numero'); $('#xCk').classList.toggle('hidden', e.target.value !== 'checklist'); });
  document.querySelectorAll('[name=eAll]').forEach(r => r.addEventListener('change', () => $('#eStores').classList.toggle('hidden', $('[name=eAll]:checked').value === 'all')));
}
function saveTask(id){
  const title = $('#eTitle').value.trim(), time = $('#eTime').value;
  const days = [...document.querySelectorAll('.eDay:checked')].map(x => Number(x.value));
  const type = $('#eType').value;
  const stores = $('[name=eAll]:checked').value === 'all' ? 'all' : [...document.querySelectorAll('.eStore:checked')].map(x => x.value);
  if (!title) return toast('Dê um nome para a rotina.');
  if (!time) return toast('Escolha o horário.');
  if (!days.length) return toast('Escolha pelo menos um dia.');
  if (stores !== 'all' && !stores.length) return toast('Escolha pelo menos uma loja.');
  const items = $('#eItems').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (type === 'checklist' && !items.length) return toast('Escreva os itens do checklist.');
  const minV = $('#eMin').value;
  const data = {title, time, days, type, stores, turno:$('#eTurno').value, hint:$('#eHint').value.trim(), pts:Number($('#ePts').value), active:$('#eAct').checked,
    unit:$('#eUnit').value.trim(), min: minV === '' ? null : Number(minV), items};
  if (id) Object.assign(task(id), data); else S.tasks.push({id:uid(), ...data});
  save(); closeSheet(); render(); toast('✅ Rotina salva.');
}

/* ---------- notificações ---------- */
let SWR = null;
const notified = (() => { try { return JSON.parse(localStorage.getItem(KEY+'.notif')) || {}; } catch(e){ return {}; } })();
function saveNotified(){ try { localStorage.setItem(KEY+'.notif', JSON.stringify(notified)); } catch(e){} }
function notifSheet(){
  const sup = 'Notification' in window, perm = sup ? Notification.permission : 'none';
  const st = !sup ? '🔕 Este navegador não mostra notificações.' : perm === 'granted' ? '🔔 Notificações ligadas.' : perm === 'denied' ? '🚫 Notificações bloqueadas.' : '🔕 Notificações ainda não foram ligadas.';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const dica = !sup && ios ? 'No iPhone: abra no Safari, toque em Compartilhar › “Adicionar à Tela de Início” e abra o app pelo ícone. Precisa do iOS 16.4 ou mais novo.'
    : perm === 'denied' ? 'Libere nas configurações do celular: Ajustes/Configurações › Notificações › Ronda (ou o navegador), ou nas permissões do site.' : '';
  sheet(`<div class="row between"><h3>Notificações</h3><button class="chip-btn" data-act="close" aria-label="Fechar">✕</button></div>
    <p style="margin-top:8px">${st}</p>${dica ? `<p class="small muted" style="margin-top:6px">${dica}</p>` : ''}
    ${sup && perm !== 'granted' && perm !== 'denied' ? `<button class="btn" style="margin-top:16px" data-act="askNotif">Ligar notificações</button>` : ''}
    <button class="btn ${sup && perm === 'granted' ? '' : 'ghost'}" style="margin-top:12px" data-act="testNotif">🔔 Testar notificação</button>
    <p class="small muted" style="margin-top:10px">O aviso de teste chega em 5 segundos. Dá tempo de bloquear a tela ou ir para outro app para ver como ele aparece.</p>`);
}
async function askNotif(){
  if (!('Notification' in window)) return notifSheet();
  if (Notification.permission === 'default') await Notification.requestPermission();
  render(); notifSheet();
  if (Notification.permission === 'granted') notify('🔔 Lembretes ligados!', 'Você vai receber um aviso na hora de cada rotina.', 'ok');
}
async function testNotif(){
  if (!('Notification' in window)) return notifSheet();
  if (Notification.permission === 'default'){ await Notification.requestPermission(); render(); }
  if (Notification.permission !== 'granted'){ notifSheet(); return toast('Primeiro é preciso permitir as notificações.'); }
  closeSheet(); toast('⏳ O aviso de teste chega em 5 segundos…');
  setTimeout(() => notify('⏰ Teste da Ronda', 'Se você está vendo isto, as notificações estão funcionando! 🎉', 'teste'), 5000);
}
function notify(title, body, tag){
  toast(`<b>${esc(title)}</b><br>${esc(body)}`);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = {body, tag, icon:'icon-192.png', badge:'icon-192.png', vibrate:[80,40,80], renotify:true, data:{url:location.href}};
  try { if (SWR) SWR.showNotification(title, opt); else new Notification(title, opt); } catch(e){}
}
function tick(){
  if (!ME) return;
  const dk = today();
  if (ME.role === 'ger'){
    const u = user(ME.id); if (!u) return;
    for (const t of myTasks(dk, u)){
      const st = status(t, dk, u.store), k = `${dk}|${u.store}|${t.id}`;
      if (st.s === 'agora' && st.diff >= 0 && !notified[k+'|hora']){ notified[k+'|hora'] = 1; notify(`⏰ ${t.time} · ${t.title}`, `Missão valendo +${t.pts+5} XP. Bora!`, t.id); }
      if (st.s === 'atrasada' && !notified[k+'|atr']){ notified[k+'|atr'] = 1; notify(`⚠️ Atrasada: ${t.title}`, `Era às ${t.time}. Ainda dá tempo de garantir metade dos pontos.`, t.id); }
    }
  } else {
    // gestor: um aviso só, juntando o que ficou atrasado ou deu problema desde a última olhada
    const novos = [];
    for (const s of S.stores) for (const t of tasksOn(dk, s.id)){
      const st = status(t, dk, s.id), k = `${dk}|${s.id}|${t.id}`;
      if (st.s === 'atrasada' && !notified[k+'|dono']){ notified[k+'|dono'] = 1; novos.push(`${s.name}: ${quem(t, s.id)} ainda não fez “${t.title}”`); }
      if (st.s === 'feito' && problem(st.r, t) && !notified[k+'|prob']){ notified[k+'|prob'] = 1; novos.push(`${s.name}: “${t.title}” ${problem(st.r, t)}`); }
    }
    if (novos.length) notify(novos.length === 1 ? '⚠️ Atenção na rede' : `⚠️ ${novos.length} avisos na rede`, novos.slice(0,2).join(' · ') + (novos.length > 2 ? ` · e mais ${novos.length-2}` : ''), 'rede');
  }
  saveNotified();
}
// ao entrar, o que já passou não vira notificação (aparece na tela)
function silencePast(){
  const dk = today();
  for (const s of S.stores) for (const t of tasksOn(dk, s.id)){
    const st = status(t, dk, s.id), k = `${dk}|${s.id}|${t.id}`;
    if (st.s === 'atrasada' || st.s === 'feito') ['|hora','|atr','|dono','|prob'].forEach(x => notified[k+x] = 1);
  }
  saveNotified();
}

/* ---------- avisos rápidos ---------- */
let toastT;
function toast(html){
  document.querySelector('.toast')?.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.innerHTML = html;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 4200);
}

/* ---------- cliques ---------- */
document.addEventListener('change', e => { if (e.target.id === 'pickStore'){ PICK = e.target.value; render(); } });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'closeBg' && e.target !== el) return;
  switch (a){
    case 'login': ME = v === 'dono' ? {role:'dono'} : {role:'ger', id:v}; saveMe(); TAB = 'hoje'; silencePast(); render(); scrollTo(0,0);
      if ('Notification' in window && Notification.permission === 'default') setTimeout(() => toast('🔔 Toque no sininho lá em cima para ligar e testar os lembretes.'), 800);
      break;
    case 'logout': ME = null; saveMe(); render(); break;
    case 'tab': TAB = v; render(); scrollTo(0,0); break;
    case 'periodo': PERIODO = v; render(); break;
    case 'mais': MAIS = !MAIS; render(); break;
    case 'notif': notifSheet(); break;
    case 'askNotif': askNotif(); break;
    case 'testNotif': testNotif(); break;
    case 'loja': openStore(v); break;
    case 'do': e.stopPropagation(); openDo(v); break;
    case 'yn': DRAFT.val = v; document.querySelectorAll('.yn button').forEach(b => b.classList.toggle('sel', b === el)); $('#noteBox').classList.toggle('hidden', v !== 'nao'); if (v === 'nao') $('#note').focus(); break;
    case 'finish': finish(); break;
    case 'close': case 'closeBg': closeSheet(); break;
    case 'partyNext': if (PARTY.length) party(PARTY); else closeSheet(); break;
    case 'proof': openProof(v); break;
    case 'edit': openEdit(v); break;
    case 'saveTask': saveTask(v); break;
    case 'delTask': if (confirm('Apagar esta rotina? O histórico dela some dos relatórios.')){ S.tasks = S.tasks.filter(t => t.id !== v); save(); closeSheet(); render(); } break;
    case 'addStore': sheet(`<div class="row between"><h3>Nova loja</h3><button class="chip-btn" data-act="close" aria-label="Fechar">✕</button></div>
      <label class="f" for="nStore">Nome da loja</label><input class="in-f" id="nStore" placeholder="Ex.: Loja Centro">
      <p class="small muted" style="margin-top:8px">As rotinas marcadas para “Todas as lojas” passam a valer nela na hora.</p>
      <button class="btn" style="margin-top:16px" data-act="saveStore">Adicionar loja</button>`); break;
    case 'saveStore': { const n = $('#nStore').value.trim(); if (!n) return toast('Escreva o nome da loja.');
      S.stores.push({id:uid(), name:n}); save(); closeSheet(); render(); toast('🏪 Loja adicionada.'); break; }
    case 'delStore': { const s = store(v); if (!confirm(`Remover a loja ${s.name} e os gerentes dela?`)) return;
      S.stores = S.stores.filter(x => x.id !== v); S.users = S.users.filter(u => u.store !== v);
      S.tasks.forEach(t => { if (Array.isArray(t.stores)) t.stores = t.stores.filter(x => x !== v); });
      save(); render(); break; }
    case 'addUser': sheet(`<div class="row between"><h3>Novo gerente</h3><button class="chip-btn" data-act="close" aria-label="Fechar">✕</button></div>
      <label class="f" for="nName">Nome</label><input class="in-f" id="nName">
      <div class="grid2"><div><label class="f" for="nStoreSel">Loja</label><select class="in-f" id="nStoreSel">${S.stores.map(s => `<option value="${s.id}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div><label class="f" for="nTurno">Turno</label><select class="in-f" id="nTurno">${TURNOS.map(x => `<option>${x}</option>`).join('')}</select></div></div>
      <label class="f">Mascote</label><div class="days">${EMOJIS.slice(0,8).map((m,i) => `<label><input type="radio" name="nEmo" value="${m}" ${i===0?'checked':''}><span style="font-size:20px;padding:6px 0">${m}</span></label>`).join('')}</div>
      <button class="btn" style="margin-top:16px" data-act="saveUser">Adicionar</button>`); break;
    case 'saveUser': { const n = $('#nName').value.trim(); if (!n) return toast('Escreva o nome.');
      S.users.push({id:uid(), name:n, store:$('#nStoreSel').value, turno:$('#nTurno').value, emoji:document.querySelector('[name=nEmo]:checked').value, color:CORES[S.users.length % CORES.length]});
      save(); closeSheet(); render(); toast('👋 Gerente adicionado.'); break; }
    case 'delUser': { const u = user(v); if (!confirm(`Remover ${u.name}?`)) return; S.users = S.users.filter(x => x.id !== v); save(); render(); break; }
    case 'saveCo': S.company = $('#coName').value.trim() || 'Minha Rede'; save(); render(); toast('Nome salvo.'); break;
    case 'reset': if (confirm('Apagar TODAS as lojas, rotinas, gerentes e histórico deste aparelho?')){ S = {company:'Minha Rede', stores:[], users:[], tasks:[], recs:[]}; save(); ME = {role:'dono'}; saveMe(); TAB = 'lojas'; render(); } break;
    case 'demo': if (confirm('Trocar tudo pelo exemplo de demonstração?')){ S = seed(); save(); silencePast(); render(); } break;
  }
});

/* ---------- início ---------- */
load(); render();
setInterval(() => { tick(); if (ME && !$('#layer').innerHTML) render(); }, 30000);
setTimeout(tick, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ME && !$('#layer').innerHTML){ render(); tick(); } });
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(r => { SWR = r; }).catch(() => {});
}
</script>
</body>
</html>
